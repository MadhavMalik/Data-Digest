[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-engine"
version = "0.1.0"
description = "AI-guided scientific relationship discovery engine with persistent evidence memory"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "polars>=1.0",
    "pyarrow>=17",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "orjson>=3.9",
]

[project.optional-dependencies]
elastic = ["elasticsearch>=8.14", "aiohttp>=3.9"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4", "mypy>=1.9"]

[project.scripts]
signal-fetch-tlc = "scripts.fetch_tlc:main"
signal-demo = "scripts.run_demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "integration: requires live external services (Elastic / LLM / Brave)",
    "e2e: end-to-end pipeline test, may require downloaded data",
    "slow: takes more than a few seconds",
]
filterwarnings = ["ignore::DeprecationWarning"]
# Async tests (the Elasticsearch integration suite) need a live event loop that
# persists across the fixture and the test body: the ES client binds its
# connection pool to the loop it was created on.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
